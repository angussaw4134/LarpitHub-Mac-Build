name: Build Larpit Hub for Mac

on:
  push:
    branches: [larpit-mac-build-20261125]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Prepare Rust for Apple silicon and Intel
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: npm ci
      - name: Bundle the universal Mac app
        env:
          APPLE_SIGNING_IDENTITY: '-'
          CI: 'true'
        run: npm run tauri -- build --target universal-apple-darwin --bundles app
      - name: Test IPA folder selection and IPA parsing
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin --lib --features tauri/custom-protocol install::tests
      - name: Create and check the portable ZIP
        run: |
          set -euo pipefail
          bundle=src-tauri/target/universal-apple-darwin/release/bundle/macos
          download=LarpitHub-1.0.5-Mac-Universal
          stage=$(mktemp -d)
          folder="$stage/Larpit Hub"
          mkdir -p "$folder/ipa1" "$folder/ipa2" "$folder/ipa3"
          ditto "$bundle/Larpit Hub.app" "$folder/Larpit Hub.app"
          cat > "$folder/Read me.txt" <<'EOF'
          Larpit Hub for Mac

          Keep Larpit Hub.app, ipa1, ipa2 and ipa3 in the same folder.
          Put one .ipa file in any of the three folders, or leave them empty.
          The IPA filename is shown on its app card.
          For custom art, add cover.png, cover.jpg, cover.jpeg or cover.webp
          to that slot's folder. Use one image up to 4 MiB per card.

          Open Larpit Hub and click Launch on the card you want to install.
          Connect your iPhone, sign in, review the app name and click Install on iPhone.
          Use Refresh slots after changing files. If your cards still appear empty,
          click Choose IPA folder and select the Larpit Hub folder containing your slots.
          EOF
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "$folder" "release/$download.zip"
          ditto -x -k "release/$download.zip" "$stage/unpacked"
          extracted="$stage/unpacked/Larpit Hub"
          app="$extracted/Larpit Hub.app"
          test -d "$extracted/ipa1"
          test -d "$extracted/ipa2"
          test -d "$extracted/ipa3"
          test -z "$(find "$extracted/ipa1" "$extracted/ipa2" "$extracted/ipa3" -mindepth 1 -print -quit)"
          test -z "$(find "$extracted" -iname '*.ipa' -print -quit)"
          exe=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Contents/Info.plist")
          lipo "$app/Contents/MacOS/$exe" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$app"
          cd release
          shasum -a 256 "$download.zip" > "$download.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: LarpitHub-1.0.5-Mac-Universal
          path: release/LarpitHub-1.0.5-Mac-Universal.*
          if-no-files-found: error
