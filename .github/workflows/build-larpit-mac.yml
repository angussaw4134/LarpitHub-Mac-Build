name: Build Larpit Hub for Mac

on:
  push:
    branches: [larpit-mac-build-20261125]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Prepare Rust for Apple silicon and Intel
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: npm ci
      - name: Bundle the universal Mac app
        env:
          APPLE_SIGNING_IDENTITY: '-'
          CI: 'true'
        run: npm run tauri -- build --target universal-apple-darwin --bundles app
      - name: Test IPA folder selection and IPA parsing
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin --lib --features tauri/custom-protocol install::tests
      - name: Create and check the portable ZIP
        run: |
          set -euo pipefail
          bundle=src-tauri/target/universal-apple-darwin/release/bundle/macos
          download=LarpitHub-1.0.3-Mac-Universal
          stage=$(mktemp -d)
          folder="$stage/Larpit Hub"
          mkdir -p "$folder/ipa1" "$folder/ipa2"
          ditto "$bundle/Larpit Hub.app" "$folder/Larpit Hub.app"
          cat > "$folder/Read me.txt" <<'EOF'
          Larpit Hub for Mac

          Keep Larpit Hub.app, ipa1 and ipa2 in the same folder.
          Put one .ipa file in ipa1 for APP 1 and one in ipa2 for APP 2.
          The filenames can be anything ending in .ipa.

          Open Larpit Hub, connect your iPhone and sign in.
          Click APP 1 or APP 2, check the app name, and click Install on iPhone.
          If the app cannot find the folders, click Choose IPA folder and select
          the Larpit Hub folder containing both ipa1 and ipa2.
          EOF
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "$folder" "release/$download.zip"
          ditto -x -k "release/$download.zip" "$stage/unpacked"
          extracted="$stage/unpacked/Larpit Hub"
          app="$extracted/Larpit Hub.app"
          test -d "$extracted/ipa1"
          test -d "$extracted/ipa2"
          test -z "$(find "$extracted/ipa1" "$extracted/ipa2" -mindepth 1 -print -quit)"
          test -z "$(find "$extracted" -iname '*.ipa' -print -quit)"
          exe=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Contents/Info.plist")
          lipo "$app/Contents/MacOS/$exe" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$app"
          cd release
          shasum -a 256 "$download.zip" > "$download.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: LarpitHub-1.0.3-Mac-Universal
          path: release/LarpitHub-1.0.3-Mac-Universal.*
          if-no-files-found: error
